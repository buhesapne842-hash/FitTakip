name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Bildirim izinlerini manifeste ekle
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Senkronize et
        run: npx cap sync android

      - name: Debug APK derle
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fittakip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
